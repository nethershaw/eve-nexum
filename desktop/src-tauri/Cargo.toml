[package]
name = "nexum-desktop"
version = "0.1.5"
description = "Nexum desktop app"
edition = "2021"

[lib]
name = "nexum_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=3.0.0-alpha.4", features = [] }

[dependencies]
tauri = { version = "=3.0.0-alpha.6", features = ["tray-icon"] }
tauri-runtime-cef = "=3.0.0-alpha.7"
tauri-plugin-clipboard-manager = "=3.0.0-alpha.3"
tauri-plugin-global-shortcut = "=3.0.0-alpha.3"
tauri-plugin-notification = "=3.0.0-alpha.3"
tauri-plugin-opener = "=3.0.0-alpha.3"
tauri-plugin-single-instance = "=3.0.0-alpha.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
dirs = "6"
url = "2"
sys-locale = "0.3"
tauri-plugin-updater = "=3.0.0-alpha.3"
tokio = { version = "1", features = ["time"] }
tauri-plugin-autostart = "=3.0.0-alpha.3"
tauri-plugin-dialog = { version = "=3.0.0-alpha.4", default-features = false, features = ["xdg-portal"] }

# Is EVE the window in front (foreground.rs): only a copy made in EVE is used.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_System_DataExchange", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(target_os = "linux")'.dependencies]
x11rb = { version = "0.13", features = ["xfixes"] }

[features]
# Microsoft Store build: no self-updater, no registry "start at login".
store = []
